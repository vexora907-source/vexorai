    <text x="180" y="230" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">POS</text>
    <text x="180" y="258" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Caja y ventas</text>
  </g>

