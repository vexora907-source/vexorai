  <path d="M930 290V340H930" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>

  <path d="M228 290C228 324 208 342 174 342H160C160 342 120 342 120 308V290" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>

  <g>
