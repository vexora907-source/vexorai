<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020817" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="48" y="42" width="1104" height="536" rx="24" stroke="#1E293B" stroke-width="2"/>

  <text x="80" y="96" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">PapelColor OS</text>
  <text x="80" y="132" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Sistema de gestión comercial + impresión</text>

  <g filter="url(#shadow)">
